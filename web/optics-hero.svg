  <radialGradient id="ground"><stop stop-color="#7491bc" stop-opacity=".28"/><stop offset="1" stop-color="#7491bc" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="16" flood-color="#587297" flood-opacity=".2"/></filter>
