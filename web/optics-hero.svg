<svg xmlns="http://www.w3.org/2000/svg" width="840" height="580" viewBox="0 0 840 580" fill="none">
 <title>镜析光学观察示意</title>
 <desc>一块透明反应孔板和放大观察窗，琥珀色溶液从深到浅排列。这是品牌示意图，不是真实测量。</desc>
 <defs>
  <linearGradient id="plate" x1="80" y1="80" x2="590" y2="350" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".98"/><stop offset=".46" stop-color="#e6eefb" stop-opacity=".9"/><stop offset="1" stop-color="#c3d2e9" stop-opacity=".85"/></linearGradient>
  <linearGradient id="edge" x1="110" y1="290" x2="620" y2="410" gradientUnits="userSpaceOnUse"><stop stop-color="#91a7c8"/><stop offset=".5" stop-color="#e8f1ff"/><stop offset="1" stop-color="#8296bb"/></linearGradient>
  <radialGradient id="well"><stop stop-color="#ffe1a1"/><stop offset=".48" stop-color="#f6b351"/><stop offset=".79" stop-color="#c6772c"/><stop offset=".92" stop-color="#995122"/><stop offset="1" stop-color="#e9bd77"/></radialGradient>
  <radialGradient id="lens"><stop stop-color="#eac187"/><stop offset=".58" stop-color="#dd9b49"/><stop offset=".87" stop-color="#ba6d34"/><stop offset="1" stop-color="#8c563a"/></radialGradient>
